<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1080,height=1920,initial-scale=1" />
<title>微诗 · 诗人行迹舆图 (poet-footprint · 苏轼)</title>
<style>
  @font-face {
    font-family: "SongSemi";
    src: url("/fonts/SourceHanSerifSC-SemiBold.otf") format("opentype");
    font-weight: 600;
    font-display: block;
  }
  @font-face {
    font-family: "SongReg";
    src: url("/fonts/SourceHanSerifSC-Regular.otf") format("opentype");
    font-weight: 400;
    font-display: block;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #14110e;
    font-family: "SongReg", "Songti SC", serif;
    -webkit-font-smoothing: antialiased;
  }

  #stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 38%, #F7EFE0 0%, #EFE3CC 65%, #E4D4B7 100%);
    color: #3E2019;
    transform-origin: top left;
    user-select: none;
  }

  /* 舆图经纬网格 */
  .atlas-grid {
    position: absolute;
    inset: 56px;
    border: 2px solid rgba(76, 34, 27, 0.24);
    background-image:
      linear-gradient(to right, rgba(76, 34, 27, 0.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(76, 34, 27, 0.055) 1px, transparent 1px);
    background-size: 120px 120px;
    pointer-events: none;
  }
  .atlas-grid::after {
    content: "";
    position: absolute;
    inset: 8px;
    border: 1px solid rgba(76, 34, 27, 0.16);
  }

  /* 顶部卷首栏 */
  #header {
    position: absolute;
    top: 108px;
    left: 108px;
    right: 108px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    z-index: 10;
  }
  .h-tag {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    letter-spacing: 0.26em;
    color: #7D4E3D;
    margin-bottom: 16px;
  }
  .h-tag::before {
    content: "";
    width: 9px;
    height: 9px;
    background: #9B382B;
    border-radius: 2px;
  }
  .h-title {
    font-family: "SongSemi", serif;
    font-size: 62px;
    letter-spacing: 0.14em;
    color: #2E1610;
    line-height: 1.2;
  }
  .h-sub {
    margin-top: 14px;
    font-size: 26px;
    letter-spacing: 0.18em;
    color: #6E4536;
  }
  .h-seal {
    width: 68px;
    height: 68px;
    background: #9B382B;
    color: #FAF3E8;
    border-radius: 6px;
    font-family: "SongSemi", serif;
    font-size: 26px;
    line-height: 1.1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6px;
    box-shadow: 0 4px 14px rgba(155, 56, 43, 0.25);
  }

  /* 舆图主画布 */
  #map-svg {
    position: absolute;
    top: 310px;
    left: 60px;
    width: 960px;
    height: 980px;
    z-index: 4;
  }

  /* 节点诗笺手卷卡片 */
  #poem-card {
    position: absolute;
    left: 104px;
    right: 104px;
    bottom: 330px;
    background: rgba(251, 246, 236, 0.92);
    border: 1.5px solid rgba(76, 34, 27, 0.22);
    border-left: 6px solid #9B382B;
    border-radius: 10px;
    padding: 34px 40px;
    box-shadow: 0 18px 44px rgba(46, 22, 16, 0.10);
    z-index: 12;
  }
  .pc-head {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 18px;
  }
  .pc-place {
    font-family: "SongSemi", serif;
    font-size: 32px;
    letter-spacing: 0.12em;
    color: #9B382B;
  }
  .pc-year {
    font-size: 22px;
    letter-spacing: 0.14em;
    color: #7D4E3D;
  }
  .pc-verse {
    font-family: "SongSemi", serif;
    font-size: 40px;
    line-height: 1.55;
    letter-spacing: 0.1em;
    color: #2B140E;
    margin-bottom: 14px;
  }
  .pc-note {
    font-size: 24px;
    line-height: 1.6;
    letter-spacing: 0.08em;
    color: #694335;
  }

  /* 底部纪年刻度尺 (Timeline Ruler) */
  #ruler-wrap {
    position: absolute;
    left: 60px;
    right: 60px;
    bottom: 140px;
    height: 128px;
    border-top: 1.5px solid rgba(76, 34, 27, 0.28);
    border-bottom: 1.5px solid rgba(76, 34, 27, 0.28);
    background: rgba(242, 231, 211, 0.78);
    overflow: hidden;
    z-index: 10;
  }
  #ruler-track {
    position: absolute;
    top: 0;
    left: 0;
    height: 100%;
    display: flex;
    align-items: center;
    will-change: transform;
  }
  .r-tick {
    width: 260px;
    flex-shrink: 0;
    padding-left: 24px;
    border-left: 1.5px solid rgba(76, 34, 27, 0.25);
    height: 76px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .r-tick.active {
    border-left: 3px solid #9B382B;
  }
  .r-year {
    font-family: "SongSemi", serif;
    font-size: 26px;
    letter-spacing: 0.12em;
    color: #3E2019;
  }
  .r-era {
    font-size: 21px;
    letter-spacing: 0.14em;
    color: #7D4E3D;
    margin-top: 6px;
  }
  #ruler-pointer {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 3px;
    height: 100%;
    background: #9B382B;
    z-index: 3;
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="atlas-grid"></div>

    <div id="header">
      <div>
        <div class="h-tag">诗人行迹 · 舆图考据</div>
        <div class="h-title">苏轼 · 问汝平生功业</div>
        <div class="h-sub">黄州 · 惠州 · 儋州 三万里贬谪诗路</div>
      </div>
      <div class="h-seal">东坡<br/>行迹</div>
    </div>

    <!-- 古风山川与行迹 SVG 舆图 -->
    <svg id="map-svg" viewBox="0 0 960 980" fill="none">
      <!-- 淡墨江河水系与南海海岸线 -->
      <path d="M 60 290 Q 260 320, 440 270 T 860 220" stroke="rgba(76,34,27,0.16)" stroke-width="5" stroke-linecap="round"/>
      <path d="M 80 302 Q 260 332, 440 282 T 860 232" stroke="rgba(76,34,27,0.08)" stroke-width="12" stroke-linecap="round"/>
      <text x="120" y="272" fill="rgba(76,34,27,0.35)" font-size="22" letter-spacing="8">大江东去 · 长江水系</text>

      <!-- 岭南山脉写意折线 -->
      <path d="M 240 530 L 295 485 L 350 530 M 320 535 L 385 472 L 450 535 M 420 530 L 475 492 L 530 530" stroke="rgba(76,34,27,0.22)" stroke-width="2.5" fill="rgba(76,34,27,0.05)"/>
      <text x="555" y="520" fill="rgba(76,34,27,0.35)" font-size="20" letter-spacing="6">五岭山脉</text>

      <!-- 琼州海峡与海南岛轮廓 -->
      <path d="M 180 735 Q 480 705, 840 650" stroke="rgba(76,34,27,0.22)" stroke-width="3" stroke-dasharray="8 8"/>
      <path d="M 330 835 Q 410 785, 515 805 Q 565 835, 520 895 Q 430 930, 340 895 Z" fill="rgba(76,34,27,0.07)" stroke="rgba(76,34,27,0.32)" stroke-width="2.5"/>
      <text x="580" y="865" fill="rgba(76,34,27,0.35)" font-size="22" letter-spacing="8">琼州 · 沧海</text>

      <!-- 朱砂行迹总虚线底 -->
      <path id="route-bg" d="M 410 110 C 460 190, 520 235, 510 310 C 498 410, 560 510, 610 620 C 565 715, 470 770, 415 845" stroke="rgba(155,56,43,0.22)" stroke-width="4" stroke-dasharray="10 10" stroke-linecap="round"/>

      <!-- 朱砂行迹动态生长实线 -->
      <path id="route-active" d="M 410 110 C 460 190, 520 235, 510 310 C 498 410, 560 510, 610 620 C 565 715, 470 770, 415 845" stroke="#9B382B" stroke-width="6" stroke-linecap="round"/>

      <!-- 起点：汴京 -->
      <g id="node-0" transform="translate(410, 110)">
        <circle r="9" fill="#4C221B"/>
        <text x="22" y="8" fill="#4C221B" font-size="26" font-family="SongSemi" letter-spacing="4">汴京 · 乌台诗案</text>
      </g>

      <!-- 第一站：黄州 (510, 310) -->
      <g id="node-1" transform="translate(510, 310)">
        <circle id="ring-1" r="28" stroke="#9B382B" stroke-width="2.5" fill="rgba(155,56,43,0.12)"/>
        <circle r="11" fill="#9B382B"/>
        <text x="36" y="-4" fill="#9B382B" font-size="34" font-family="SongSemi" letter-spacing="6">黄州</text>
        <text x="36" y="28" fill="#6E4536" font-size="22" letter-spacing="3">元丰三年 · 45岁 · 东坡居士</text>
      </g>

      <!-- 第二站：惠州 (610, 620) -->
      <g id="node-2" transform="translate(610, 620)">
        <circle id="ring-2" r="28" stroke="#9B382B" stroke-width="2.5" fill="rgba(155,56,43,0.12)"/>
        <circle r="11" fill="#9B382B"/>
        <text x="36" y="-4" fill="#9B382B" font-size="34" font-family="SongSemi" letter-spacing="6">惠州</text>
        <text x="36" y="28" fill="#6E4536" font-size="22" letter-spacing="3">绍圣元年 · 59岁 · 岭南风物</text>
      </g>

      <!-- 第三站：儋州 (415, 845) -->
      <g id="node-3" transform="translate(415, 845)">
        <circle id="ring-3" r="28" stroke="#9B382B" stroke-width="2.5" fill="rgba(155,56,43,0.12)"/>
        <circle r="11" fill="#9B382B"/>
        <text x="-210" y="-4" fill="#9B382B" font-size="34" font-family="SongSemi" letter-spacing="6">儋州</text>
        <text x="-260" y="28" fill="#6E4536" font-size="22" letter-spacing="3">绍圣四年 · 62岁 · 天涯万里</text>
      </g>
    </svg>

    <!-- 节点诗作手卷卡片 -->
    <div id="poem-card">
      <div class="pc-head">
        <span class="pc-place" id="pc-place">黄州 · 定风波</span>
        <span class="pc-year" id="pc-year">公元 1082 · 元丰五年</span>
      </div>
      <div class="pc-verse" id="pc-verse">莫听穿林打叶声，何妨吟啸且徐行。</div>
      <div class="pc-note" id="pc-note">竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。</div>
    </div>

    <!-- 底部滑动纪年标尺 -->
    <div id="ruler-wrap">
      <div id="ruler-pointer"></div>
      <div id="ruler-track"></div>
    </div>
  </div>

<script type="module">
  import { clamp, lerp, inv, easeOut, easeInOut } from '/tools/video-studio/core/weishi-video-core.js';

  window.DUR = 20;
  window.READY = false;

  const STOPS = [
    {
      t0: 0.8,
      t1: 7.2,
      routeEnd: 0.34,
      year: 1080,
      era: '元丰三年 · 45岁',
      place: '第一站 · 黄州《定风波》',
      yearLabel: '公元 1082 · 元丰五年 · 赤壁躬耕',
      verse: '莫听穿林打叶声，何妨吟啸且徐行。',
      note: '竹杖芒鞋轻胜马，谁怕？一蓑烟雨任平生。苏轼自此号「东坡居士」。',
    },
    {
      t0: 7.2,
      t1: 13.6,
      routeEnd: 0.72,
      year: 1094,
      era: '绍圣元年 · 59岁',
      place: '第二站 · 惠州《食荔枝》',
      yearLabel: '公元 1096 · 绍圣三年 · 嘉祐寺松风亭',
      verse: '日啖荔枝三百颗，不辞长作岭南人。',
      note: '年近花甲再贬岭南，于山水风物间化苦旅为清欢。',
    },
    {
      t0: 13.6,
      t1: 20.0,
      routeEnd: 1.0,
      year: 1097,
      era: '绍圣四年 · 62岁',
      place: '第三站 · 儋州《六月二十日夜渡海》',
      yearLabel: '公元 1100 · 元符三年 · 渡海北归',
      verse: '九死南荒吾不恨，兹游奇绝冠平生。',
      note: '问汝平生功业，黄州惠州儋州。胸中浩然之气，终成千古绝唱。',
    },
  ];

  // 构建底部纪年刻度尺
  const rulerTrack = document.getElementById('ruler-track');
  const YEARS = [
    { y: '1079 年', e: '元丰二年 · 乌台诗案' },
    { y: '1080 年', e: '元丰三年 · 初到黄州' },
    { y: '1082 年', e: '元丰五年 · 前后赤壁赋' },
    { y: '1094 年', e: '绍圣元年 · 南迁惠州' },
    { y: '1097 年', e: '绍圣四年 · 渡海贬儋州' },
    { y: '1100 年', e: '元符三年 · 遇赦北归' },
  ];
  YEARS.forEach((item) => {
    const d = document.createElement('div');
    d.className = 'r-tick';
    d.innerHTML = `<div class="r-year">${item.y}</div><div class="r-era">${item.e}</div>`;
    rulerTrack.appendChild(d);
  });

  const routePath = document.getElementById('route-active');
  const totalLen = 960;
  routePath.style.strokeDasharray = `${totalLen}`;

  const pcCard = document.getElementById('poem-card');
  const pcPlace = document.getElementById('pc-place');
  const pcYear = document.getElementById('pc-year');
  const pcVerse = document.getElementById('pc-verse');
  const pcNote = document.getElementById('pc-note');

  window.EV = [
    { t: 0.2, sfx: 'qin-harmonic', gain: -8 },
    { t: 1.1, sfx: 'seal-stamp', gain: -4 },
    { t: 7.4, sfx: 'page-turn', gain: -6 },
    { t: 7.9, sfx: 'seal-stamp', gain: -4 },
    { t: 13.8, sfx: 'page-turn', gain: -6 },
    { t: 14.3, sfx: 'seal-stamp', gain: -3.5 },
  ];

  window.TEXTS = function (t) {
    const active = STOPS.find((s) => t >= s.t0 && t <= s.t1) || STOPS[0];
    return [
      { id: `stop-${active.year}-verse`, text: active.verse },
      { id: `stop-${active.year}-note`, text: active.note },
    ];
  };

  window.render = function (t) {
    const ct = clamp(t, 0, window.DUR);

    // 1. 计算朱砂行迹曲线生长进度
    let routeProg = 0;
    if (ct < 7.2) {
      routeProg = lerp(0, 0.34, easeInOut(inv(0.4, 2.2, ct)));
    } else if (ct < 13.6) {
      routeProg = lerp(0.34, 0.72, easeInOut(inv(7.2, 9.0, ct)));
    } else {
      routeProg = lerp(0.72, 1.0, easeInOut(inv(13.6, 15.4, ct)));
    }
    routePath.style.strokeDashoffset = `${(totalLen * (1 - routeProg)).toFixed(1)}`;

    // 2. 三处州郡节点点亮与水波呼吸
    const n1 = easeOut(inv(1.2, 2.0, ct));
    const n2 = easeOut(inv(7.8, 8.6, ct));
    const n3 = easeOut(inv(14.2, 15.0, ct));
    document.getElementById('node-1').style.opacity = lerp(0.25, 1, n1).toFixed(3);
    document.getElementById('node-2').style.opacity = lerp(0.22, 1, n2).toFixed(3);
    document.getElementById('node-3').style.opacity = lerp(0.22, 1, n3).toFixed(3);

    const pulse = 24 + Math.sin(ct * 3.6) * 5;
    document.getElementById('ring-1').setAttribute('r', n1 > 0.5 ? pulse.toFixed(1) : '18');
    document.getElementById('ring-2').setAttribute('r', n2 > 0.5 ? pulse.toFixed(1) : '18');
    document.getElementById('ring-3').setAttribute('r', n3 > 0.5 ? pulse.toFixed(1) : '18');

    // 3. 当前站点诗作手卷卡片更新
    const stopIdx = ct < 7.2 ? 0 : ct < 13.6 ? 1 : 2;
    const stop = STOPS[stopIdx];
    const localIn = easeOut(inv(stop.t0 + 0.2, stop.t0 + 0.85, ct));
    pcPlace.textContent = stop.place;
    pcYear.textContent = stop.yearLabel;
    pcVerse.textContent = stop.verse;
    pcNote.textContent = stop.note;
    pcCard.style.opacity = localIn.toFixed(3);
    pcCard.style.transform = `translateY(${((1 - localIn) * 14).toFixed(1)}px)`;

    // 4. 底部纪年刻度尺平滑横移
    const rulerX = lerp(240, -780, easeInOut(ct / window.DUR));
    rulerTrack.style.transform = `translateX(${rulerX.toFixed(1)}px)`;
  };

  await document.fonts.ready;
  window.render(0);
  window.READY = true;
</script>
</body>
</html>
